name: Promote to production

on:
  push:
    branches: [main]

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Promote latest deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not configured — skipping auto-promote."
            exit 0
          fi
          npm install --no-save --no-audit --prefer-offline vercel@latest > /dev/null 2>&1 || true
          if ! command -v vercel > /dev/null; then
            echo "::error::vercel CLI not available"
            exit 1
          fi
          echo "$VERCEL_TOKEN" | vercel login --token "$VERCEL_TOKEN" --scope team_yWJsw0FoQ8oy1Ys0ZNCEec7Y 2>&1 | head -5 || true
          # Pick the most recent Ready production deployment — mirror scripts/promote.sh.
          URL="$(vercel ls fetchcpu-simulator --no-color --limit 10 \
            | grep -oE 'https://[a-z0-9-]+-pochonskis-projects\.vercel\.app.*●.*Ready' \
            | grep -oE 'https://[a-z0-9-]+-pochonskis-projects\.vercel\.app' \
            | head -1 || true)"
          if [ -z "$URL" ]; then
            echo "::error::No Ready deployment found — skipping alias update."
            exit 1
          fi
          vercel alias set "$URL" fetchcpu-pocho.vercel.app
          if ! curl -sSf -o /dev/null -w "  HTTP %{http_code} (%{size_download} bytes)\n" "https://fetchcpu-pocho.vercel.app/"; then
            echo "::error::Smoke test failed after alias update."
            exit 1
          fi
          echo "::notice::Promoted fetchcpu-pocho.vercel.app to $URL"
