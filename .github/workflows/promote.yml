name: Promote to production

on:
  push:
    branches: [main]

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-alias the canonical domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: fetchcpu-simulator
          VERCEL_ALIAS: fetchcpu-pocho.vercel.app
        run: |
          set -euo pipefail
          # If the token is missing, fail loudly with actionable
          # instructions. Previously this step exited 0 silently, which
          # left the canonical domain pointing at a stale deployment
          # while CI reported success — a footgun for production.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured in GitHub."
            echo "::error::The canonical domain $VERCEL_ALIAS will stay on its previous deployment."
            echo "::error::Either set the VERCEL_TOKEN secret (Settings → Secrets and variables → Actions)"
            echo "::error::or run scripts/promote.sh locally to re-alias the latest build."
            exit 1
          fi
          # Install the Vercel CLI once and make sure it's on PATH.
          # `--no-save` keeps package.json unchanged; the install is a
          # throwaway and npx reuses the cache on subsequent runs.
          if ! command -v vercel > /dev/null 2>&1; then
            npm install --no-save --no-audit --prefer-offline vercel@latest > /dev/null 2>&1
            export PATH="$PWD/node_modules/.bin:$PATH"
          fi
          if ! command -v vercel > /dev/null 2>&1; then
            echo "::error::vercel CLI not available — install failed."
            exit 1
          fi
          # Pre-authenticate so subsequent vercel calls don't re-prompt.
          echo "$VERCEL_TOKEN" | vercel login --token "$VERCEL_TOKEN" --scope team_yWJsw0FoQ8oy1Ys0ZNCEec7Y > /dev/null 2>&1 || true
          # Pick the most recent Ready production deployment. Use plain
          # grep rather than a multi-line regex so the workflow survives
          # any Vercel CLI formatting change.
          URL="$(vercel ls "$VERCEL_PROJECT" --no-color --limit 10 \
            | grep 'Ready' \
            | grep -oE 'https://[a-z0-9-]+-pochonskis-projects\.vercel\.app' \
            | head -1 || true)"
          if [ -z "$URL" ]; then
            echo "::error::No Ready deployment found — skipping alias update."
            exit 1
          fi
          # Detect a stale alias BEFORE swapping. If the canonical domain
          # is already pointing at this build, the step is a no-op — we
          # skip the smoke test (which would 200 against the same
          # deployment twice) and exit 0 quickly.
          CURRENT="$(curl -sSI -o /dev/null -w '%{redirect_url}' "https://$VERCEL_ALIAS/" || true)"
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "https://$URL" ]; then
            echo "::notice::Alias already up to date ($VERCEL_ALIAS → $URL)."
            exit 0
          fi
          echo "::notice::Re-aliasing $VERCEL_ALIAS → $URL (was: ${CURRENT:-<none>})"
          # `vercel alias set` is idempotent: it replaces an existing
          # alias. We do NOT call `vercel alias rm` first because that
          # would create a window where the canonical domain is
          # unaliased and any user request would 404.
          vercel alias set "$URL" "$VERCEL_ALIAS"
          # Smoke-test the canonical domain to make sure assets load.
          if ! curl -sSf -o /dev/null -w "  HTTP %{http_code} (%{size_download} bytes)\n" "https://$VERCEL_ALIAS/"; then
            echo "::error::Smoke test failed after alias update."
            exit 1
          fi
          # Confirm the new logo asset is reachable (regression guard for
          # stale aliases pointing at pre-rebrand deployments).
          if ! curl -sSf -o /dev/null "https://$VERCEL_ALIAS/assets/logo.png"; then
            echo "::error::assets/logo.png is 404 on $VERCEL_ALIAS — alias may be stale."
            exit 1
          fi
          echo "::notice::Promoted https://$VERCEL_ALIAS/ → $URL"
